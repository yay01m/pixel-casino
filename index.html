<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PIXEL CASINO</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="pixel-bg"></div>

  <span class="coin c1"></span>
  <span class="coin c2"></span>
  <span class="coin c3"></span>
  <span class="coin c4"></span>

  <header>

    <div class="logo">
      PIXEL
      <span>CASINO</span>
    </div>

    <nav>
      <a href="./index.html" class="active">ホーム</a>
      <a href="./games.html">ゲーム</a>
      <a href="#">ボーナス</a>
      <a href="#">ランキング</a>
    </nav>

    <div class="header-buttons">

      <div class="points-display">
        POINTS :
        <span id="points">30</span>
      </div>

      <a href="./games.html" class="btn btn-yellow">
        今すぐプレイ
      </a>

    </div>

  </header>

  <main>

    <section class="hero">

      <div class="hero-left">

        <h1>
          PIXEL
          <span>CASINO</span>
        </h1>

        <p class="lead">
          遊ぶほど熱くなる、最強カジノ体験。
        </p>

        <p class="sub">
          スロット、ルーレット、ポーカーを搭載した
          ハイクオリティゲームサイト。
        </p>

        <div class="cta">

          <a href="./games.html" class="btn btn-yellow">
            ゲーム選択へ
          </a>

        </div>

      </div>

      <div class="hero-right">

        <div class="beam beam-green"></div>
        <div class="beam beam-purple"></div>

        <div class="castle">

          <div class="side-build left"></div>
          <div class="side-build right"></div>

          <div class="tower left"></div>
          <div class="tower right"></div>

          <div class="center-build"></div>

          <div class="crown">♛</div>

          <div class="casino-sign">
            CASINO
          </div>

        </div>

      </div>

    </section>

  </main>

  <script src="script.js"></script>

</body>
</html>
