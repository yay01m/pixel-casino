<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PIXEL CASINO</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<section class="hero">

  <header class="header">

    <div class="logo">
      PIXEL
      <span>CASINO</span>
    </div>

    <nav class="nav">
      <a class="active" href="index.html">ホーム</a>
      <a href="games.html">ゲーム</a>
      <a href="bonus.html">ボーナス</a>
      <a href="ranking.html">ランキング</a>
    </nav>

    <div class="right">
      <div class="points">
        POINTS :
        <span id="points">30</span>
      </div>

      <button
        class="play-btn"
        onclick="location.href='games.html'">

        今すぐプレイ

      </button>
    </div>

  </header>

  <main class="hero-content">

    <button
      class="main-btn"
      onclick="location.href='games.html'">

      👑 ゲーム選択へ

    </button>

  </main>

  <div class="online-box">

    <p>● ONLINE PLAYERS</p>

    <strong id="onlineCount">0</strong>

  </div>

  <div class="info-bar">

    <div class="info">

      <span>🎁</span>

      <div>
        <h3>新規登録ボーナス</h3>
        <p>特典を受け取ってゲームを楽しもう！</p>
      </div>

    </div>

    <div class="info">

      <span>🏆</span>

      <div>
        <h3>ランキング機能</h3>
        <p>上位を目指して報酬を獲得！</p>
      </div>

    </div>

    <div class="info">

      <span>👑</span>

      <div>
        <h3>VIPプログラム</h3>
        <p>遊ぶほど特典が増えていく！</p>
      </div>

    </div>

    <div class="info">

      <span>🛡️</span>

      <div>
        <h3>安心・安全</h3>
        <p>公正なゲームで安心してプレイ！</p>
      </div>

    </div>

  </div>

</section>

<script src="script.js"></script>

</body>
</html>
